[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gated-communities"
version = "0.1.0"
description = "Gated Communities API with tiered access control"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    # Pinned to a known-compatible pair so the pydantic/pydantic-core ABI check
    # never resolves to a mismatched build.
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.1.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "aiofiles>=23.2.1",
    "PyJWT>=2.8.0",
    "prometheus-client>=0.20.0",
    "langchain-core>=0.3.0",
    "bleach>=6.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.19.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.19.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "bandit>=1.7.7",
    "safety>=3.0.0",
    "pip-audit>=2.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Quarantine: tests/_unimplemented/ holds tests for modules that were never
# implemented (importing src.* roots that do not exist). Explicitly excluded —
# a leading underscore alone does NOT stop pytest from collecting a directory.
addopts = "--ignore=tests/_unimplemented"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "F401", "F841"]

[tool.ruff.lint]
select = ["E9", "F821", "F811"]
ignore = []

[tool.mypy]
files = ["src/gated_communities"]
mypy_path = "src"
explicit_package_bases = true
