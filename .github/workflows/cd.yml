name: CD — Docker Build & Push

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v1.0.0 or sha)"
        required: false
        default: "latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact-name: digests-amd64
          - platform: linux/arm64
            artifact-name: digests-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          labels: ${{ steps.meta.outputs.tags }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          provenance: true
          sbom: true

      - name: Export digest
        id: digest
        shell: bash
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_DIGEST}" ]; then
            echo "::error::build-push-action returned no digest for ${{ matrix.platform }}"
            exit 1
          fi
          # Name the file after the digest itself so that download-artifact's
          # merge-multiple:true can never overwrite a sibling platform's file.
          mkdir -p "${RUNNER_TEMP}/digests"
          printf '%s' "${BUILD_DIGEST#sha256:}" > "${RUNNER_TEMP}/digests/${BUILD_DIGEST#sha256:}"
          echo "digest=${BUILD_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Exported ${{ matrix.platform }} -> ${BUILD_DIGEST}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Generate attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  merge-manifests:
    name: Merge Multi-Arch Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-push
    outputs:
      version: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        shell: bash
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No digest files downloaded — build-and-push did not upload digests-*"
            exit 1
          fi
          # Each source must be a FULLY QUALIFIED reference (repo@sha256:...). A bare
          # digest such as "sha256:abc..." is what produced "invalid reference format".
          refs=()
          for f in "${files[@]}"; do
            refs+=("${IMAGE_REF}@sha256:$(cat "$f")")
          done
          # Build the --tag arguments as an array so no word-splitting is involved.
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done < <(jq -cr '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if [ ${#tags[@]} -eq 0 ]; then
            echo "::error::metadata-action produced no tags — nothing to publish"
            exit 1
          fi
          echo "Merging ${#refs[@]} platform manifest(s) into ${#tags[@]} tag(s):"
          printf '  %s\n' "${refs[@]}"
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}"

  scan-image:
    name: Scan Pushed Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: merge-manifests
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Lowercase image name
        id: image
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          # Scan the tag that was actually published for this ref, not a hardcoded
          # ":latest" (which only exists on the default branch).
          image-ref: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ needs.merge-manifests.outputs.version }}
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-results
          path: trivy-image-results.sarif
          retention-days: 14