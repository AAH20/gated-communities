name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  STAGING_HOST: staging.gated-communities.example.com
  PRODUCTION_HOST: gated-communities.example.com

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: https://${{ env.STAGING_HOST }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying image ${{ needs.build.outputs.image_tag }} to staging..."
          echo "Image digest: ${{ needs.build.outputs.image_digest }}"
          # Add your staging deployment commands here
          # Example: kubectl set image deployment/app app=${{ needs.build.outputs.image_tag }} --namespace=staging
          # Example: ssh user@staging "docker pull ${{ needs.build.outputs.image_tag }} && docker-compose up -d"

      - name: Verify staging deployment
        run: |
          echo "Waiting for staging deployment to be ready..."
          sleep 10
          curl -sf https://${{ env.STAGING_HOST }}/health || exit 1

  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging..."
          # Add your smoke test commands here
          # Example: npm run test:smoke -- --base-url https://${{ env.STAGING_HOST }}
          # Example: pytest tests/smoke/ --base-url https://${{ env.STAGING_HOST }}
          curl -sf https://${{ env.STAGING_HOST }}/health || exit 1
          curl -sf https://${{ env.STAGING_HOST }}/api/v1/status || exit 1

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            test-results/
            coverage/
          retention-days: 7

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: smoke-tests
    environment:
      name: production
      url: https://${{ env.PRODUCTION_HOST }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying image ${{ needs.build.outputs.image_tag }} to production..."
          echo "Image digest: ${{ needs.build.outputs.image_digest }}"
          # Add your production deployment commands here
          # Example: kubectl set image deployment/app app=${{ needs.build.outputs.image_tag }} --namespace=production
          # Example: ssh user@production "docker pull ${{ needs.build.outputs.image_tag }} && docker-compose up -d"

      - name: Verify production deployment
        run: |
          echo "Waiting for production deployment to be ready..."
          sleep 10
          curl -sf https://${{ env.PRODUCTION_HOST }}/health || exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Production deployment failed! Initiating rollback..."
          # Add your rollback commands here
          # Example: kubectl rollout undo deployment/app --namespace=production
          exit 1
