# Prometheus Configuration for Gated Communities Monitoring
# Production-grade configuration with proper scrape intervals, relabeling, and remote write

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: production
    project: gated-communities
    region: us-east-1

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      scheme: http
      timeout: 10s
      api_version: v2

# Rule files
rule_files:
  - /etc/prometheus/rules/alert-rules.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
    metrics_path: /metrics
    scrape_interval: 30s

  # Node Exporter — host-level metrics
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
    metrics_path: /metrics
    scrape_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(:[0-9]+)?'
        replacement: '${1}'

  # Application metrics — gated-communities API
  - job_name: gated-communities-api
    static_configs:
      - targets:
          - api:8080
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - target_label: service
        replacement: gated-communities

  # Community service metrics
  - job_name: community-service
    static_configs:
      - targets:
          - community-service:8081
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true

  # Membership service metrics
  - job_name: membership-service
    static_configs:
      - targets:
          - membership-service:8082
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true

  # Access control service metrics
  - job_name: access-control-service
    static_configs:
      - targets:
          - access-control-service:8083
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true

  # PostgreSQL exporter
  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
    metrics_path: /metrics
    scrape_interval: 30s

  # Redis exporter
  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121
    metrics_path: /metrics
    scrape_interval: 30s

  # Blackbox exporter — endpoint availability
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:8080/health
          - http://api:8080/ready
          - http://community-service:8081/health
          - http://membership-service:8082/health
          - http://access-control-service:8083/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Blackbox exporter — TCP connectivity
  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - postgres:5432
          - redis:6379
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # cAdvisor — container metrics
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
    metrics_path: /metrics
    scrape_interval: 15s

  # Grafana self-monitoring
  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000
    metrics_path: /metrics
    scrape_interval: 30s

# Remote write configuration (optional — for long-term storage)
# remote_write:
#   - url: http://thanos-receive:19291/api/v1/receive
#     queue_config:
#       max_samples_per_send: 1000
#       max_shards: 200
#       capacity: 2500

# Storage configuration
storage:
  tsdb:
    retention.time: 30d
    retention.size: 50GB
